apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dso202-pod-and-service-reader
  namespace: dso202-assignment-01
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]